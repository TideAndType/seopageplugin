name: PHP Tests

on:
  pull_request:
  push:
    branches:
      - ttgmbapp
      - 'claude/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        run: find seo-command-center tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Admin JavaScript syntax check
        run: node --check seo-command-center/assets/js/admin.js

      - name: Unit tests
        run: php tests/run-tests.php

  package:
    name: Build WordPress install ZIP
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/ttgmbapp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' seo-command-center/seo-command-center.php | head -n1 | xargs)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build WordPress install ZIP
        shell: bash
        run: zip -r "TideOrbit-${{ steps.version.outputs.version }}.zip" seo-command-center

      - name: Upload WordPress install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TideOrbit-WordPress-Install-${{ steps.version.outputs.version }}
          path: TideOrbit-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14
