name: PHP Tests

on:
  pull_request:
  push:
    branches:
      - ttgmbapp
      - 'claude/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        run: find seo-command-center tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Admin JavaScript syntax check
        run: |
          node --check seo-command-center/assets/js/admin.js
          node --check seo-command-center/assets/js/editor.js

      - name: Unit tests
        run: php tests/run-tests.php

  package:
    name: Build WordPress install ZIP
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/ttgmbapp')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' seo-command-center/seo-command-center.php | head -n1 | xargs)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build lean production-only plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging/seo-command-center
          cp -a seo-command-center/. packaging/seo-command-center/
          # Documentation and the original unminified sources remain in Git,
          # not in the WordPress installation archive.
          rm -rf packaging/seo-command-center/docs
          # Build-time-only tooling: no npm/React dependencies shipped or loaded.
          for file in packaging/seo-command-center/assets/js/*.js; do
            out="${file%.js}.pack.js"
            npx --yes terser@5.44.1 "$file" --compress --mangle --output "$out"
            node --check "$out"
            mv "$out" "$file"
          done
          for file in packaging/seo-command-center/assets/css/*.css; do
            out="${file%.css}.pack.css"
            npx --yes clean-css-cli@5.6.3 --output "$out" "$file"
            test -s "$out"
            mv "$out" "$file"
          done
          # Preserve the required WordPress plugin header and uninstall
          # source. Strip PHP comments/whitespace in distributed includes
          # only; source files in Git remain readable and documented.
          find packaging/seo-command-center/includes -type f -name '*.php' -print0 | xargs -0 -n1 php -r 'file_put_contents($argv[1], php_strip_whitespace($argv[1]));'
          # Validate ALL production PHP files after stripping.
          php -l packaging/seo-command-center/seo-command-center.php
          find packaging/seo-command-center -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          # Run the same regression suite against files as INSTALLED,
          # not just the readable development sources.
          cp -a tests packaging/tests
          ( cd packaging && php tests/run-tests.php )
          rm -rf packaging/tests
          echo "Production plugin bytes: $(du -sb packaging/seo-command-center | cut -f1)"

      - name: Build WordPress install ZIP
        shell: bash
        run: |
          set -euo pipefail
          ( cd packaging && zip -qr "../TideOrbit-${{ steps.version.outputs.version }}.zip" seo-command-center )
          unzip -tq "TideOrbit-${{ steps.version.outputs.version }}.zip"
          if unzip -Z1 "TideOrbit-${{ steps.version.outputs.version }}.zip" | grep -E '^seo-command-center/docs/|/\.git/|/node_modules/'; then
            echo "Developer-only files escaped into the package"
            exit 1
          fi
          echo "Install ZIP bytes: $(stat -c '%s' TideOrbit-${{ steps.version.outputs.version }}.zip)"

      - name: Upload WordPress install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TideOrbit-WordPress-Install-${{ steps.version.outputs.version }}
          path: TideOrbit-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14
