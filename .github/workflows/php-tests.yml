name: PHP Tests

on:
  pull_request:
  push:
    branches:
      - ttgmbapp
      - 'claude/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax check
        run: find seo-command-center tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit tests
        run: php tests/run-tests.php
